name: Atualizar dados e publicar

# Compila o front (web/), gera os dados (Padel API + SportScore) e publica no GitHub Pages.
# Roda a cada push, a cada 5 minutos (workflow_dispatch chamado pelo Worker do Cloudflare em
# gatilho/) e quando pedido na mão (aba Actions > Run workflow).
on:
  push:
    branches: [main]
  schedule:
    # Reserva, caso o Worker pare: o agendamento do GitHub atrasa e pula execuções.
    # Fora da virada da hora, que é quando ele mais atrasa.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma execução por vez, sem cancelar a que está no meio (ela chega a publicar);
# se chegarem várias enquanto isso, só a mais nova fica na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artefato.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar o front
        run: |
          npm ci --prefix web
          npm run build --prefix web
        env:
          # endereço do Worker api/ (busca de torneios no SportScore). Vazio = só a busca na lista
          VITE_API_URL: ${{ vars.API_URL }}
      # Cache das fontes de uma execução para a outra: só busca de novo o que pode ter mudado.
      # A chave muda a cada execução; o restore pega a mais recente que começa com "robo-".
      - name: Recuperar o cache do robô
        uses: actions/cache/restore@v6
        with:
          path: .cache-robo
          key: robo-${{ github.run_id }}
          restore-keys: robo-
      - name: Gerar site e dados
        run: node scripts/gerar-site.js _site
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
          # código do Cloudflare Web Analytics (não é segredo: aparece na página). Vazio = sem analytics
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          # id do site no Umami Cloud (também aparece na página). Vazio = sem Umami
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - name: Guardar o cache do robô
        uses: actions/cache/save@v6
        with:
          path: .cache-robo
          key: robo-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - id: artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Faz o mesmo que o actions/deploy-pages (cria a publicação na API do Pages e espera o status),
      # mas com uma versão por execução. O deploy-pages usa o SHA do commit como versão, e o robô
      # publica centenas de vezes com o mesmo commit: em 04/11/2026 o Pages passou a aceitar essas
      # publicações repetidas, responder "succeed" e continuar servindo o conteúdo antigo.
      - id: deployment
        name: Publicar no GitHub Pages
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo
            const versao = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`
            const artifact_id = Number(process.env.ARTIFACT_ID)
            if (!artifact_id) throw new Error('O build não informou o artifact_id do upload-pages-artifact')

            const { data: criada } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id, pages_build_version: versao, oidc_token: await core.getIDToken(),
            })
            const id = criada.id || versao
            core.info(`Publicação ${id} criada (artefato ${artifact_id})`)
            core.setOutput('page_url', criada.page_url)

            const falhas = ['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']
            const limite = Date.now() + 10 * 60 * 1000
            let errosSeguidos = 0
            for (;;) {
              await new Promise((r) => setTimeout(r, 5000))
              let status
              try {
                ({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id }))
                errosSeguidos = 0
              } catch (erro) {
                if (++errosSeguidos >= 10) throw erro
                core.warning(`Status indisponível (HTTP ${erro.status}), tentando de novo`)
                continue
              }
              if (status === 'succeed') { core.info('Publicado.'); break }
              if (falhas.includes(status)) throw new Error(`A publicação falhou: ${status}`)
              core.info(`Status: ${status}`)
              if (Date.now() > limite) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id }).catch(() => {})
                throw new Error('A publicação passou de 10 minutos e foi cancelada')
              }
            }
